name: Publish to PyPI

# Publishes sdist + wheel to PyPI on every `v*` tag, using PyPI Trusted
# Publishing (OIDC) — no API token stored in the repo.
#
# One-time setup (repo owner, on pypi.org):
#   1. Account settings -> Publishing -> Add a new pending publisher:
#        PyPI project name: honestcode
#        Owner: Fengrru  Repository: honestcode
#        Workflow: publish.yml  Environment: pypi
#   2. The first `v*` tag then creates the project and publishes it; every
#      later tag reuses the same trusted publisher.

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
