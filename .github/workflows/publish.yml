name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (leave empty to read from pyproject.toml)"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write      # create/update GitHub Release, push CHANGELOG
  id-token: write      # OIDC trusted publishing to PyPI
  attestations: write  # Artifact attestations for dist files

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: "Resolve version (single source of truth: pyproject.toml)"
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(python scripts/read-version.py)" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote CHANGELOG [Unreleased] -> [version]
        id: changelog
        run: |
          python scripts/prepare-release.py "${{ steps.ver.outputs.version }}" \
            && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Commit promoted CHANGELOG
        if: steps.changelog.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): promote [Unreleased] into [${{ steps.ver.outputs.version }}]"
          git push origin HEAD:main

      - name: Build package
        run: python -m build

      - name: Verify package metadata
        run: twine check dist/*

      - name: Generate SHA256SUMS
        run: ( cd dist && sha256sum * > SHA256SUMS )

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Extract release notes
        id: notes
        run: |
          python scripts/extract-release-notes.py "${{ steps.ver.outputs.version }}" > /tmp/notes.md \
            || python scripts/extract-release-notes.py Unreleased > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::No release notes in CHANGELOG.md for [${{ steps.ver.outputs.version }}]."
            exit 1
          fi

      - name: Create or update GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file /tmp/notes.md
          fi

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Verify publication on PyPI
        run: |
          PKG="honestcode"
          VER="${{ steps.ver.outputs.version }}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://pypi.org/pypi/$PKG/json" 2>/dev/null | grep -q "\"$VER\""; then
              echo "Confirmed $PKG==$VER on PyPI"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Package not visible on PyPI after 60s."
          exit 1
