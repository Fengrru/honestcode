name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint (github annotations)
        run: ruff check honestcode tests scripts benchmarks --output-format=github

      - name: Ruff format check
        run: ruff format --check honestcode tests scripts benchmarks

      - name: Pre-commit hooks
        run: |
          pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: "Test with pytest (coverage gate: 80%)"
        run: pytest --cov=honestcode --cov-report=xml --cov-report=term --cov-fail-under=80

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  test-optional-extras:
    # The pydantic-ai integration and the multi-language scanners are optional
    # extras; without this job their tests are skipped on every run and a
    # breaking dependency upgrade goes unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (all extras)
        run: pip install -e ".[dev,pydantic-ai,multi-language]"

      - name: Test with optional integrations enabled
        run: pytest

      - name: MCP end-to-end smoke test
        run: python scripts/e2e_mcp_test.py

      - name: Run the demo end to end
        run: python demos/invented-api/run.py

  benchmark-accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Agent-accuracy benchmark
        run: python benchmarks/agent_accuracy/run.py --format text

  benchmark-realworld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Real-world false-positive benchmark
        run: python benchmarks/realworld_fp/run.py --format text

  benchmark-value-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Value-drift benchmark
        run: python benchmarks/value_drift/run.py

  benchmark-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Performance benchmark
        run: python scripts/benchmark.py --repeat 3 --format text
