repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(honestcode|tests|scripts|benchmarks)/
      - id: ruff-format
        files: ^(honestcode|tests|scripts|benchmarks)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Vendored upstream sources must stay byte-identical to the snapshot.
      - id: trailing-whitespace
        exclude: ^benchmarks/realworld_fp/vendor/
      - id: end-of-file-fixer
        exclude: ^benchmarks/realworld_fp/vendor/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
